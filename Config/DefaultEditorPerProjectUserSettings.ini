; Editor-only, per-project user settings.

; ── Unreal MCP (UE 5.8+) ──────────────────────────────────────────────────────
; VibeUE v5.0 is no longer a standalone server on :8088 — it registers its 33
; service toolsets and 86 AgentSkills onto Epic's NATIVE MCP endpoint instead
; (ModelContextProtocol, Experimental). That endpoint ships with
; bAutoStartServer=false, so without this block nothing listens and every agent
; tool call fails with the editor apparently healthy — the same silent-failure
; shape as the SteamSockets net driver. Section name is the settings class's
; module (ModelContextProtocolEngine), not the plugin folder name.
;
; ServerPortNumber/ServerUrlPath are the engine defaults, restated so the value
; the agent config points at is visible here rather than implied.
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True
ServerPortNumber=8000
ServerUrlPath=/mcp
; Tool search: tools/list returns only list_toolsets / describe_toolset /
; call_tool, and the ~34 toolsets are loaded on demand. Keeps agent context
; small; set False only if a client can't dispatch through call_tool.
bEnableToolSearch=True
