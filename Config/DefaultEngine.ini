[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
; Class paths MUST be the fully-qualified /Script/ form. The short "Module.Class" form does NOT
; resolve for SteamSockets (verified 2026-08-07: short form silently fell back to IpNetDriver,
; /Script/ form loaded correctly), and StaticLoadClass is called with LOAD_Quiet so the failure
; is invisible. Short form happens to work for some core modules, which is what makes it a trap.
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SteamSockets.SteamSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="Engine.DemoNetDriver",DriverClassNameFallback="Engine.DemoNetDriver")

[OnlineSubsystem]
DefaultPlatformService=Steam

[OnlineSubsystemSteam]
bEnabled=true
SteamDevAppId=4567540
bInitServerOnClient=true
bHasVoiceEnabled=false
; Keep SteamSockets OFF the default socket subsystem slot. SteamSocketsNetDriver asks for its
; subsystem BY NAME, so it does not need to be the default — but IpNetDriver takes whatever the
; default is. Left true (the engine default), a fallback to IpNetDriver hands it Steam sockets,
; which then tries to bind the local SteamID and fails SO_BROADCAST, so the host cannot listen
; AT ALL (observed 2026-08-07). False keeps the fallback path a working plain-UDP host.
bUseSteamNetworking=false

; SteamSockets = Valve's SteamNetworkingSockets transport (NAT punchthrough + Valve relay).
; The legacy OnlineSubsystemSteam.SteamNetDriver class this used to point at was MOVED to the
; SocketSubsystemSteamIP plugin, which is not enabled here — so the old config silently fell back
; to IpNetDriver, which cannot connect to the steam.<SteamID64> URLs Steam lobbies advertise.
; NOTE: BaseEngine.ini already defines this section (connection class + timeouts). This line only
; restates the connection class in the /Script/ form — do NOT write the short form here, it would
; override a correct engine default with one that fails to resolve, and it would only surface when
; a client actually connects rather than at listen time.
[/Script/SteamSockets.SteamSocketsNetDriver]
NetConnectionClassName="/Script/SteamSockets.SteamSocketsNetConnection"

